name: docs

# Site de documentação (VitePress) + llms.txt no GitHub Pages.
# Requer: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'packages/skills/**'
      - 'scripts/llms*'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      # valida frontmatter, paridade EN/PT e links internos; gera llms.txt e llms-full.txt em docs-site/public
      - name: llms.txt
        run: npx tsx scripts/llms.ts
      - name: build (fails on dead links)
        run: npx vitepress build docs-site
        env:
          DOCS_BASE: /caju_motion/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
