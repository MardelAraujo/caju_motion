name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # render de verdade (Chrome do runner + ffmpeg-static): MP4 com áudio, still, WebM, PNG, cancelamento, A/V sync
      - name: render integration tests
        if: runner.os == 'Linux'
        env:
          CAJU_RENDER_IT: '1'
        run: |
          # o render usa o ffmpeg-static; o ffprobe do sistema só verifica os arquivos gerados
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npx vitest run packages/renderer-node --maxWorkers=1
      # os pacotes publicados precisam funcionar sem o monorepo: empacota e confere o CLI instalado
      - name: smoke test (npm pack + install)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/pack && for p in schema core renderer audio server studio sdk renderer-node cli; do (cd packages/$p && npm pack --silent --pack-destination /tmp/pack); done
          cd /tmp/pack && npm init -y >/dev/null
          for p in schema core renderer audio server studio sdk renderer-node; do npm pkg set "overrides.@caju-motion/$p=file:./$(ls caju-motion-$p-[0-9]*.tgz)"; done
          npm install --no-audit --no-fund ./caju-motion-cli-[0-9]*.tgz ./caju-motion-renderer-[0-9]*.tgz
          npx caju --version
          npx caju new smoke --format square-1x1 && npx caju check smoke
          npx caju still smoke --frame 0 --out smoke.png && test -s smoke.png
